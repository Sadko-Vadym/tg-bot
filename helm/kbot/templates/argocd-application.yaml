{{- if .Values.argocd.create }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "kbot.fullname" . }}
  namespace: {{ .Values.argocd.namespace | default "argocd" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project | default "default" }}
  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: {{ .Values.argocd.targetRevision | default "HEAD" }}
    path: {{ .Values.argocd.path | default "helm/kbot" }}
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.argocd.destinationNamespace | default "default" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}


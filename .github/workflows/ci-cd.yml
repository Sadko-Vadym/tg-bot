name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: den-vasyliev/kbot
  PLATFORM: linux/amd64
  VERSION: v1.0.0

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get Git commit SHA
        id: git
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}-${{ steps.git.outputs.sha }}-linux-amd64
            type=raw,value=${{ env.VERSION }}-${{ steps.git.outputs.sha }}-linux-amd64,enable={{ isDefaultBranch }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ steps.git.outputs.sha }}

      - name: Update Helm values.yaml
        run: |
          GIT_COMMIT=${{ steps.git.outputs.sha }}
          sed -i "s|tag:.*|tag: \"${{ env.VERSION }}-${GIT_COMMIT}\"|" helm/kbot/values.yaml
          sed -i 's|^  os:.*|  os: "linux"|' helm/kbot/values.yaml
          sed -i 's|^  arch:.*|  arch: "amd64"|' helm/kbot/values.yaml
          echo "Updated values.yaml:"
          cat helm/kbot/values.yaml | grep -A 5 "^image:"

      - name: Configure Git for commits
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Commit Helm chart changes
        env:
          GITHUB_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add helm/kbot/values.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update helm values.yaml with new image tag ${{ env.VERSION }}-${{ steps.git.outputs.sha }}"
            git push
          fi

      - name: Output image reference
        run: |
          echo "IMAGE_REF=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ steps.git.outputs.sha }}-linux-amd64" >> $GITHUB_ENV
          echo "Built and pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ steps.git.outputs.sha }}-linux-amd64"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

  deploy:
    name: Deploy to Kubernetes via ArgoCD
    needs: [build-and-push, test]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Verify Helm chart
        run: |
          helm lint helm/kbot || echo "Helm lint completed with warnings"

      - name: ArgoCD Sync (if configured)
        run: |
          echo "ArgoCD will automatically sync when Helm values are updated in the repository"
          echo "Make sure ArgoCD Application is configured to watch this repository"

